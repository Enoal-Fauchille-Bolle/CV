# cv.yaml — single source for every PDF (FR/EN, public/private, per-offer).
#
# Schema (v1)
# -----------
# Text      Translatable text is a `{fr, en}` mapping. Language-neutral values
#           (proper nouns, technologies, URLs) are plain strings.
# Dates     `"YYYY-MM"`, always quoted. `end: null` means "ongoing".
# Entries   Every list entry has a unique `id` and a `tags` list. Variants and
#           per-offer builds select and order entries by `id` and `tags`.
# Bullets   `bullets` is a list of `{fr, en}` items, most important first.
# Private   Phone number lives in the git-ignored `private.yaml`, loaded only
#           with `--input private=true` (see README, "Private data").
#
# Sections: header, headline, experience, projects, education, skills,
# languages, certifications, volunteering.
#
# Sample entries below illustrate the schema; content is written in #5 to #9.

