server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Do not announce the nginx version in the Server header or on error pages.
    server_tokens off;

    # File names come from NAME in the Makefile.
    set $cv_fr CV-Enoal-Fauchille-Bolle-FR.pdf;
    set $cv_en CV-Enoal-Fauchille-Bolle-EN.pdf;

    # English version, short URL. The header gives downloads the proper name.
    location ~ ^/en/?$ {
        add_header Content-Disposition 'inline; filename="CV-Enoal-Fauchille-Bolle-EN.pdf"';
        try_files /$cv_en =404;
    }

    # The two files by name.
    location ~ ^/CV-Enoal-Fauchille-Bolle-(FR|EN)\.pdf$ {
        try_files $uri =404;
    }

    # Everything else serves the French version, as the single PDF did before,
    # so old links keep working.
    location / {
        add_header Content-Disposition 'inline; filename="CV-Enoal-Fauchille-Bolle-FR.pdf"';
        try_files /$cv_fr =404;
    }
}
