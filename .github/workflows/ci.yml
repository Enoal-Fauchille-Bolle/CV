name: CI

# Builds the public PDFs and runs the ATS checks. Also called by
# docker-publish.yml, so a release only ships PDFs that passed them.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags, so `git describe` can print the version.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Refresh the package index first: it goes stale on the runner image (404).
      - name: Install poppler-utils (pdftotext, pdfinfo)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      # Builds dist/*.pdf with --pdf-standard ua-1 (a failure stops here),
      # then runs scripts/check-ats.sh (a failing check fails the workflow).
      - name: Build the PDFs and run the ATS checks
        run: make check

      - name: Keep the checked PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: dist/*.pdf
          if-no-files-found: error

  # Every `make TAG=<tag>` variant passes the same checks. A separate job, so
  # the variants stay out of the `pdfs` artifact attached to the Release.
  variants:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags, so `git describe` can print the version.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ImageMagick is for the photo stand-in below. Refresh the package index
      # (stale otherwise, 404) and skip the recommended packages (ghostscript...).
      - name: Install poppler-utils and ImageMagick
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils imagemagick

      # The real phone and photo never reach the CI. Stand-ins of the same shape
      # still exercise the tightest layout: two-line header, photo column.
      # Typst reads photo.jpg as a JPEG from its extension, hence ImageMagick.
      - name: Stand in for the git-ignored private files
        run: |
          cp src/private.example.yaml src/private.yaml
          convert -size 64x64 xc:gray src/photo.jpg

      # The default public version is checked by `build-and-check`, and `core`
      # alone is never sent: only the default private version is added here.
      - name: Build and check every variant, public and private
        run: |
          fail=0
          make private || fail=1
          for tag in $(scripts/tags.sh --names | grep -vx core); do
            make check TAG="$tag" || fail=1
            make private TAG="$tag" || fail=1
          done
          scripts/check-ats.sh dist/*-private.pdf || fail=1
          exit "$fail"

  # The Dockerfile is otherwise only built when a tag is pushed. Build it on
  # every push, without publishing, so a broken image never waits for a release.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      # Full history and tags, so `git describe` can print the version.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the Docker image (not pushed)
        run: make image
