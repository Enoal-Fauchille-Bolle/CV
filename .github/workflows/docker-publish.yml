name: Docker Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history, to find the previous final tag for the notes.
          fetch-depth: 0

      - name: Set image name, Typst version and PDF date
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TYPST_VERSION=$(make -s typst-version)" >> "$GITHUB_ENV"

      # The PDFs that passed the ATS checks, attached to the Release below.
      - name: Download the checked PDFs
        uses: actions/download-artifact@v8
        with:
          name: pdfs
          path: dist

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `v3.1.0` gets `3.1.0` and `latest`; a pre-release such as `v3.1.0-rc.1`
      # only gets `3.1.0-rc.1`, so it never reaches what ArgoCD pulls.
      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=semver,pattern={{version}}

      # The context is the repository root: the Dockerfile compiles the PDFs.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            TYPST_VERSION=${{ env.TYPST_VERSION }}
            VERSION=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The notes always start at the previous final tag: `v3.1.0-rc.2` and
      # `v3.1.0` both list everything since `v3.0.0`, never just since `rc.1`.
      - name: Find the range of the Release notes
        id: range
        run: |
          previous=$(git tag --merged "$GITHUB_REF_NAME" --list 'v[0-9]*' --sort=-v:refname \
            | grep -v -e '-' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          echo "range=${previous:+$previous..$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Write the Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.range }} --tag ${{ github.ref_name }} --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: dist/*.pdf
          fail_on_unmatched_files: true
