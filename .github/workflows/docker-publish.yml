name: Docker Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image name, Typst version and PDF date
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TYPST_VERSION=$(make -s typst-version)" >> "$GITHUB_ENV"

      # The PDFs that passed the ATS checks, attached to the Release below.
      - name: Download the checked PDFs
        uses: actions/download-artifact@v8
        with:
          name: pdfs
          path: dist

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `v3.1.0` gets `3.1.0` and `latest`; a pre-release such as `v3.1.0-rc.1`
      # only gets `3.1.0-rc.1`, so it never reaches what ArgoCD pulls.
      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=semver,pattern={{version}}

      # The context is the repository root: the Dockerfile compiles the PDFs.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            TYPST_VERSION=${{ env.TYPST_VERSION }}
            VERSION=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.pdf
          fail_on_unmatched_files: true
